name: Release

# 打一个 `v*` 标签即发布：先跑一遍完整校验（与 CI 同款，标签也可能打在坏提交上），
# 通过后再用标签本身当发布说明的起点建一个 GitHub Release。
# 中继**不发 npm**（它是 self-hosted 的单文件产物），版本靠标签表达。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成 release notes 需要完整历史

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # 协议包发布前，`^1.0.0` 解析不出来；首次发布协议包后即可改成 `--frozen-lockfile`。
      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Type-check, format check, build, tests
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm test

      - name: Verify the tag matches package.json version
        env:
          # 通过 env 传事件字段，避免把可被影响的值直接插进脚本。
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          tag="${TAG_NAME#v}"
          pkg="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          if [ "$tag" != "$pkg" ]; then
            echo "标签 v$tag ≠ package.json 里的版本 $pkg"
            exit 1
          fi
          echo "版本一致：$pkg"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
