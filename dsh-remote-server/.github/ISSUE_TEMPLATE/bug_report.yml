name: Bug 报告
description: 中继服务里有东西行为不对。
title: 'bug: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug。**请勿在此报告安全漏洞**——见
        [SECURITY.md](https://github.com/providcc/dsh-remote-server/blob/main/SECURITY.md)。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 对 bug 的清晰简洁描述。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的是什么？
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 一段能稳定触发该问题的命令、配置或步骤。
      render: sh
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: 例如 1.0.0 或某个 commit SHA
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: 运行时与部署形态
      placeholder: 例如 Node 22.23.3 / 单文件产物 / systemd + nginx / Docker
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志行
      description: NDJSON 日志（**请先抹掉 token、配对码与任何明文**）。
      render: json
    validations:
      required: false
