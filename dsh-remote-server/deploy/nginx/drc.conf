# nginx vhost for the dsh-remote-control relay.
#
# Install to /etc/nginx/conf.d/drc.conf (conf.d is included inside the http
# block, so the http-level directives below are valid here too).
#
#   drc.provid.cc  --wss-->  nginx (TLS)  --ws-->  127.0.0.1:8787
#
# Certificates are issued/renewed by acme.sh with the Aliyun DNS-01 hook
# (see deploy/README.md). Nothing needs port 80 at renewal time.

# ── http-level directives ────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP throttle. The relay only has global + per-connection budgets because
# it cannot see the real client IP; this is where per-IP limiting belongs.
limit_req_zone $binary_remote_addr zone=drc:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=drc_conn:10m;

# ── port 80: redirect only ───────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name drc.provid.cc;
    return 301 https://$host$request_uri;
}

# ── port 443: TLS + WebSocket reverse proxy ──────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name drc.provid.cc;

    ssl_certificate     /etc/nginx/ssl/drc.provid.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/drc.provid.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/drc.access.log main;
    error_log  /var/log/nginx/drc.error.log warn;

    # WebSocket upgrade + long-lived connection
    location / {
        limit_req  zone=drc burst=40 nodelay;
        limit_conn drc_conn 8;

        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # the relay is a long-lived socket: never time it out mid-session
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
