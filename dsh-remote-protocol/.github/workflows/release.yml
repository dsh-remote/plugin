name: Release

# 打一个 `v*` 标签即发布：先跑一遍完整校验（与 CI 同款，标签也可能打在坏提交上），
# 通过后**先发 npm**，再用标签本身当发布说明的起点建一个 GitHub Release。
#
# 顺序有意如此：npm 先、release 后。若 npm 发失败而 Release 已经建出来，
# 就会出现"有 Release 没包"的假象；反过来（发了包、Release 没建）最多是少一条公告，
# 且可以手工补。两者都不可能回滚，所以把较轻的那个放在后面。
#
# `dsh-remote-wire` 是**发 npm 的**：server 与 control 两个仓都以 `^1.0.0` 消费它，
# 这样它们能带 lockfile、CI 能跑 `--frozen-lockfile`。别再退回 git 依赖——那会要求
# 两个消费仓各写一条按 commit 精确锁定的 `allowBuilds` 键来放行 `prepare`（实测 pnpm 11
# 只认这一种形式），协议每次升版都得手改两处。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 建 GitHub Release
  id-token: write # npm provenance 需要 OIDC

jobs:
  release:
    name: verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成 release notes 需要完整历史

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check, format check, build, tests
        run: |
          pnpm typecheck
          pnpm format:check
          pnpm test

      - name: Verify the tag matches package.json version
        env:
          # 通过 env 传事件字段，避免把可被影响的值直接插进脚本。
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -e
          tag="${TAG_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "标签 v$tag ≠ package.json 里的版本 $pkg"
            exit 1
          fi
          echo "版本一致：$pkg"

      # prepare 脚本会在发布前重新构建 dist，`publishConfig.provenance` 打开 provenance 证明。
      # 仓库需要配置 NPM_TOKEN secret（Automation 类型 token）。
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --access public --no-git-checks

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --verify-tag
