name: Feature request
description: Propose a new capability or an improvement.
title: 'feat: '
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the library does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Include API sketches if you have them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Reminder: this package is a **frozen wire contract** mirrored by the Mini Program
        client. Changes to encoding, key derivation, or nonce layout require coordinating both
        implementations and adding a differential test.
