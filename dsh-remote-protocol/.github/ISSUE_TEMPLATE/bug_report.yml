name: Bug 报告
description: 协议库里有东西行为不对。
title: 'bug: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug。**请勿在此报告安全漏洞**——见
        [SECURITY.md](https://github.com/providcc/dsh-remote-protocol/blob/main/SECURITY.md)。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 对 bug 的清晰简洁描述。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望的是什么？
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 一段能稳定触发该问题的代码或步骤。
      render: ts
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: 例如 1.0.0 或某个 commit SHA
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: 运行时
      placeholder: 例如 Node 22.23.3 / 微信小程序 / 其他
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 涉及哪一端？
      multiple: true
      options:
        - 协议库（本仓）
        - 中继服务
        - 宿主插件
        - 小程序客户端
        - 不确定
    validations:
      required: true
