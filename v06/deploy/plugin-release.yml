name: Release

on:
  push:
    tags: ['v0.6.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v06
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: v06/package-lock.json
      - run: npm ci
      - name: Check tag and run plugin tests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"
          node --test --test-reporter=tap tests/host.test.cjs tests/harness.test.cjs tests/plugin-package.test.cjs
      - name: Build and publish both install names under next
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"
          node scripts/build-plugin.cjs --out dist/alias --name dsh-remote-control
          node scripts/build-plugin.cjs --out dist/scoped --name @dsh-remote/plugin
          for target in alias scoped; do
            name="$(node -p "require('./dist/$target/package.json').name")"
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "$name@$version already published"
            else
              npm publish "./dist/$target" --access public --tag next --provenance
            fi
          done
      - name: Create the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false --title "$RELEASE_TAG" \
              --notes '0.6 plugin for the parallel /v06 relay. Both npm install names use the next tag.'
          fi
