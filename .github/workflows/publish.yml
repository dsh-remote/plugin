# 发布到 npm：**走 Trusted Publishing（OIDC），没有 NPM_TOKEN**。
#
# ⚠️ **本包没有 `prepare` / `prepublishOnly` 钩子**（`protocol` 有 `prepare`，这是两包之间
# 一个真实存在的不对称，不是笔误）⇒ `npm publish` **不会**替你构建，会把当时的 `dist/`
# 原样发出去。所以下面那步 `pnpm build` 不是"顺手跑一下"，它是**发布物的唯一来源**：
# 删掉它，发出去的就是上一次构建的产物，而版本号是新的。
#
# ## 为什么必须有这个文件
#
# `npm trust github <包> --repo <owner>/<repo> --file publish.yml --allow-publish`
# 里的 `--file` 指的是**仓库里真实存在的工作流**。npm 侧**不校验它存不存在** ——
# 拿一个不存在的文件名做 `--dry-run` 照样打印"配好了"。⇒ 没有这个文件，
# 那条信任关系会配成功、却永远等不到一次发布（看起来是绿的，实际是死的）。
#
# ## 为什么是 Node 24 而不是 .nvmrc 里的 22
#
# 🔴 **这是最容易踩的一个**：npm 从 **11.5.1** 起才支持"用 OIDC token 换一个
# 短时发布 token"。而 **Node 22 带的是 npm 10.9.x**（实测 v22.23.3 → npm 10.9.9），
# 它**不认识** OIDC ⇒ `npm publish` 会以一个和"信任没配好"长得一模一样的错误收场。
# Node 24 带 npm 11.16+（实测 v24.18.1 → 11.16.0、v24.21.0 → 11.19.0）✅。
#
# 所以这里**刻意不写 `node-version-file: .nvmrc`**（那是 CI 的三平台矩阵在用的），
# 并且下面加了一条自检：npm 版本不够就**当场红并说清原因**，而不是让它去撞一个看不懂的错。
# 包本身的 `engines.node` 仍是 `>=20`，**消费方不受影响** —— 变的只是构建这台机器。
#
# ## 为什么没有 secrets
#
# 全程不引用任何 secret。`id-token: write` 让 GitHub 签一个 OIDC token，
# npm 拿它去和 GitHub 核对"这次运行确实是这个仓、这个工作流"，然后发一个短时 token。
# ⇒ 没有长期凭据可以泄漏、没有 90 天轮换。
#
# ⚠️ 反过来说：**任何能改这个文件的人都能发版**。所以它的权限面要一直保持这么小
# （`contents: read` + `id-token: write`，不给 `write`）。
name: Publish

on:
  # 打 tag 才发。不用 push:main —— 那会让每次合并都尝试发布，而 npm 版本号不可重用，
  # 第二次就红，红久了就没人看了。
  push:
    tags: ['v*']
  # 手动兜底：tag 推失败、或要补发时用。
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # ← OIDC。Trusted Publishing 的全部前提就是这一行。

concurrency:
  # 同一个 tag 不许并发发两次（npm 版本号不可重用，撞上就是一次不可恢复的失败）。
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: 装 Node 24（带 npm 11，Trusted Publishing 需要 >= 11.5.1）
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          # 必须给：它既让 `npm publish` 打到公共 registry，
          # 也让 npm 的 OIDC 客户端知道该去哪个 registry 换发布 token。
          registry-url: 'https://registry.npmjs.org'

      - name: 自检 npm 版本支持 OIDC 换 token
        run: |
          set -eu
          V="$(npm --version)"
          echo "node $(node --version) / npm $V"
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const ok = v[0] > 11 || (v[0] === 11 && v[1] >= 5);
            if (!ok) {
              console.error(`::error::npm ${process.argv[1]} 不支持 OIDC 换发布 token（需要 >= 11.5.1）。`);
              console.error("Node 22 带的是 npm 10.9.x，所以这个 job 必须用 Node 24。");
              process.exit(1);
            }
          ' "$V"

      - run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      # ⚠️ 排在 publish **之前**：tag 与 package.json 版本不一致时，
      # `npm publish` 一旦跑出去就**不可恢复**（版本号不可重用）。
      - name: tag 必须与 package.json 的版本逐字一致
        run: |
          set -eu
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json = $VERSION / tag = $GITHUB_REF_NAME"
          [ "$VERSION" = "$TAG" ] || {
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 $VERSION 不一致 —— 先对齐再发，npm 版本号不可重用。"
            exit 1
          }

      # 打包内容先看一眼：`files` 白名单写错时，这里能看出来。
      - name: 打印将要发布的内容
        run: npm pack --dry-run

      # `provenance` 由 package.json 的 `publishConfig.provenance: true` 打开 ——
      # 这里不传 `--provenance`，避免两处口径。
      - name: 发布
        run: npm publish
