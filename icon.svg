<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Remote control">
  <!-- 配对入口的图示：一张二维码 + 右下角那台手机。
       两个形状都只用一种颜色，缩到 16px 还认得出；不用渐变、不用文字。 -->
  <g fill="none" stroke="#247bbf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="34" height="34" rx="4"/>
    <rect x="15" y="15" width="16" height="16" rx="2"/>
    <path d="M14 48h10M14 56h4M26 48v8"/>
  </g>
  <rect x="34" y="34" width="24" height="24" rx="5" fill="#247bbf"/>
  <rect x="40" y="40" width="12" height="12" rx="2" fill="#ffffff"/>
</svg>
