name: 功能建议
description: 提议一个新能力或改进。
title: 'feat: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        提需求前先看一眼 [README](https://github.com/providcc/dsh-remote-mp#readme) 与
        [docs/ARCHITECTURE.md](https://github.com/providcc/dsh-remote-mp/blob/main/docs/ARCHITECTURE.md)，
        尤其是「还没做」一节。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述痛点，而不是直接给方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 有想法就说，没有可以留空。

  - type: checkboxes
    id: constraints
    attributes:
      label: 已知边界确认
      options:
        - label: 这个改动不会把 PSK / 配对载荷写进日志或上报
        - label: 这个改动不会破坏按需注入的前提（`app.json` 不放全局 `usingComponents`）
        - label: 这个改动不会让"失败"被渲染成"没有数据"
