packages:
  # 五棵私有树（apps/server、packages/{protocol,plugin,presentation}、mp）已删除，
  # 代码的唯一事实源是四个开源仓目录（它们各自是独立 git 仓，不在本工作区里）。
  # e2e 与 scripts 留在伞仓、不开源，引用的都是开源仓的**产物路径**。
  - e2e

# pnpm 11：允许执行 postinstall 的依赖要显式放行（写在 package.json 的 pnpm 字段已不被读取）。
# esbuild 需要它的安装脚本落下平台二进制，而中继与插件的打包步骤都要用它。
# 注意 `allowBuilds` 的值必须是布尔：pnpm 报错时给的模板是"set this to true or false"，
# 原样留着那行字符串等于留了一个解析不了的键。
allowBuilds:
  esbuild: true

onlyBuiltDependencies:
  - esbuild
