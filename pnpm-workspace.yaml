# ⚠️ 独立仓里的这个文件不是"工作区定义"，是 pnpm 的设置位。
#
# pnpm 11 起，`allowBuilds` 这类设置读的是 `pnpm-workspace.yaml`（不再读
# package.json 的 `pnpm` 段）。本仓没有别的包，所以这里的 `packages` 留空。
#
# 为什么必须有它：中继与插件的单文件打包走 esbuild，而 esbuild 的安装脚本要落下
# **平台二进制**。pnpm 11 默认不执行任何依赖的安装脚本 ⇒ 报
# `ERR_PNPM_IGNORED_BUILDS`，而且**连 `pnpm typecheck` 都会失败**
# （pnpm 会先跑一次 deps-status 检查，那一步就是 `pnpm install`）。
#
# 由 `scripts/split-repos.mjs` 生成，不要手工改 —— 改了下次同步会被覆盖。
allowBuilds:
  esbuild: true

# ── 新发布版本 24 小时冷却（minimumReleaseAge）的**窄例外** ──────────────────
#
# ⚠️ 2026-10-12 部署 3.1.4 时三个平台的 CI 同时红在这里：
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] @dsh-remote/protocol@3.1.4 was published
#   at 2026-10-12T00:44:42Z, within the minimumReleaseAge cutoff
#   （pnpm 在 `pnpm install --frozen-lockfile` 之前按 supply-chain 策略核一遍锁文件）
#
# 因果链：protocol 与 relay/plugin 是**同一次发版流程**里前后脚发出的
# （必须先发 protocol，否则 relay 编译对着旧协议 ⇒ 另一片红）。而冷却策略的用途是
# "别让刚发布的**第三方**代码直接进生产"——这里刚发布的正是**我们自己的包**，
# 且是下游等着的那个版本。⇒ 只对**我们自己这个包**开例外，别的一律仍受冷却保护。
#
# ## ⚠️⚠️ 两条实测出来的语义（2026-10-12，踩了两轮才搞明白）
#
# **① 这个表是按顺序取"第一个能用的"，不是取最高版本。**
#   实测（同一个 `^3.0.0` 依赖，只换排除表）：
#     [3.1.4]           → 装 3.1.4
#     [3.1.3, 3.1.4]    → 装 **3.1.3**（按列表顺序，不是最高）
#     [3.1.4, 3.1.3]    → 装 3.1.4
#     [3.1.5]（不存在）  → 退回冷却后的解析 ⇒ 装 **3.1.0**
#   ⇒ **想让 CI 装哪个版本，就把它写在第一行。**
#
# **② 表里出现一个注册表上不存在的版本，整张表就失效**（第 4 行实测）。
#
# ## 所以这里写两行、且顺序是"注册表 latest 在前、清单版本在后"
#
# 清单版本（`packages/protocol/package.json`）与**注册表上真正会被解析到的版本**
# 不是一回事：客户端单独 bump 时（例如 2026-10-12 的小程序审核整改 3.1.5），
# protocol 的清单写着 3.1.5 而 npm 上最新仍是 3.1.4 —— 若把 3.1.5 写在前面，
# 它不存在 ⇒ 整张表失效 ⇒ 解析退回 3.1.3/3.1.0（那些版本的
# `hello.protocol` 还是可选的 ⇒ relay 的判据在 CI 上红）。
# ⇒ 先写注册表 latest（CI 会装的那个），再写清单版本（正常发版流程里它俩相同、
#   去重后只剩一行）。
# `npm view` 失败（离线）时只写清单版本：少一条例外最多让下一次同步在本地红，
# 而"悄悄少排除一个"会让 CI 红得莫名其妙。
minimumReleaseAgeExclude:
  - '@dsh-remote/protocol@3.1.4'
  - '@dsh-remote/protocol@3.1.5'
