# 随包分发的默认配置行（profile 自己的 cordis.patch.yml 会覆盖这里的值）。
#
# 为什么单独一行而不是并进主插件：这一行需要 `webServer` 才做得了事，而主插件刻意
# 不写任何 inject 闸门。拆开之后，宿主没有 webServer 时只有这一行不激活，
# 主插件的配对/中继链路一行都不受影响（理由详见 src/config.ts）。
#
# 同样**不写 inject 闸门**：对 `dshRemoteControl` / `webServer` 都软探测。
#
# imageFile 故意不在这里写死：默认值取 homedir（见 src/config.ts），
# 写进 YAML 就把某个人的家目录焊死进分发包了。
- insert:
    - id: dsh-remote-control-presentation
      name: dsh-remote-control-presentation
      config:
        enabled: true
        refreshMs: 2000
