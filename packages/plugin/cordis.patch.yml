- insert:
    # No `inject:` gate on purpose: apply() feature-detects every kernel face
    # (typertGateway / apiProxy / commands) itself, so gating here would only
    # add a way for the row to silently never activate.
    - id: dsh-remote-control
      name: dsh-remote-control
      config:
        enabled: true
        serverUrl: ws://127.0.0.1:8787
        hostTokenEnv: DRC_HOST_TOKEN
        hostLabel: dsh-host
        keepAwake:
          enabled: true
          idleReleaseSec: 300
          keepDisplay: false
